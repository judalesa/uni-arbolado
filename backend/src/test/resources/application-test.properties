# Configuracion de PRUEBAS (perfil "test"). Todos los valores son falsos y solo sirven aqui.
# Reemplaza cualquier application-local.properties real para que las pruebas NUNCA toquen la BD
# de verdad ni envien correos.

# H2 en memoria en modo MySQL (no hay Docker; decision D-32)
spring.datasource.url=jdbc:h2:mem:arbolado;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.seguridad.jwt-secreto=solo-para-pruebas-no-es-un-secreto-0000000000
app.seguridad.jwt-expiracion-minutos=60
app.seguridad.aes-llave-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.seguridad.codigo-hmac-secreto=solo-para-pruebas-hmac
app.admin.documento=0000000001
app.admin.nombre=Administrador de Pruebas
app.admin.correo=admin.pruebas@example.com
app.admin.contrasena=clave-de-pruebas-1
app.cors.allowed-origins=http://localhost:4200,https://sitio-permitido.example.com
app.correo.modo=log
app.correo.remitente=pruebas@example.com

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
