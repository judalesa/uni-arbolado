# ============================================================================
# PLANTILLA de configuracion local. NO contiene valores reales.
#
# Como usarla:
#   1) Copia este archivo como  application-local.properties  (en esta misma carpeta).
#   2) Reemplaza cada <VALOR> por el tuyo.
#   3) application-local.properties esta en .gitignore: NUNCA lo subas a GitHub.
#
# El WAR que se construye con tu archivo local CONTIENE estos secretos:
# nunca lo publiques (ni en GitHub ni en releases).
# ============================================================================

# --- Base de datos (cada integrante usa la suya) ---
spring.datasource.url=jdbc:mysql://<HOST>:3306/<NOMBRE_BD>
spring.datasource.username=<USUARIO_BD>
spring.datasource.password=<CLAVE_BD>

# --- Seguridad ---
# Secreto del JWT: al menos 32 caracteres aleatorios
app.seguridad.jwt-secreto=<SECRETO_JWT_DE_32_O_MAS_CARACTERES>
app.seguridad.jwt-expiracion-minutos=60
# Llave AES de 256 bits en Base64 (32 bytes aleatorios codificados en Base64)
app.seguridad.aes-llave-base64=<LLAVE_AES_256_BASE64>
# Secreto para firmar (HMAC) los codigos de verificacion
app.seguridad.codigo-hmac-secreto=<SECRETO_HMAC>

# --- Administrador precargado (RN-05) ---
app.admin.documento=<DOCUMENTO_10_DIGITOS>
app.admin.nombre=<NOMBRE_COMPLETO>
app.admin.correo=<CORREO>
app.admin.contrasena=<CLAVE_INICIAL_MIN_8>

# --- Documentacion Swagger (apagada por defecto; en el servidor compartido dejala apagada) ---
# Para verla en tu computador: http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- CORS: origenes del frontend, separados por coma ---
app.cors.allowed-origins=http://localhost:4200,https://<TU-SITIO>.netlify.app

# --- Correo ---
# modo=log  -> imprime el codigo en el log (desarrollo, no envia correo)
# modo=smtp -> envia por SMTP (requiere los datos de abajo)
app.correo.modo=log
app.correo.remitente=<CORREO_REMITENTE>
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<CORREO_DEDICADO>
spring.mail.password=<CONTRASENA_DE_APLICACION>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
