# ============================================================================
# Configuracion COMPARTIDA y SIN SECRETOS (esta si se versiona).
# Los valores reales (BD, claves, correo, administrador) viven en
# application-local.properties, que esta en .gitignore. Plantilla:
# application-example.properties
# Si falta algun valor obligatorio, la aplicacion NO arranca (decision D-05).
# ============================================================================
spring.application.name=uni-arbolado-back
spring.config.import=optional:classpath:application-local.properties

# --- Persistencia ---
# update: crea/ajusta las tablas al arrancar (lo exige el profesor; sin Flyway).
spring.jpa.hibernate.ddl-auto=update
# Evita consultas perezosas fuera de la transaccion: el controlador nunca ve entidades.
spring.jpa.open-in-view=false
# Los instantes se guardan en UTC (RNF-14).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Documentacion (Swagger) ---
# Apagada por defecto: en el servidor compartido no se expone la API (TD-07).
# Para encenderla en desarrollo, ponga estas dos en true en application-local.properties.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Registro (log) ---
# Nunca se registran contrasenas, codigos ni tokens (TD-16).
logging.level.root=INFO
