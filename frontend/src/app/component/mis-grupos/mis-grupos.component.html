<!-- Encabezado con el filtro de periodo -->
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h4 mb-0"><i class="fa-solid fa-users me-2" aria-hidden="true"></i>Mis grupos</h1>
  @if (periodos().length > 0) {
    <div class="d-flex align-items-center gap-2">
      <label class="form-label mb-0" for="filtro-periodo">Periodo</label>
      <select
        id="filtro-periodo"
        class="form-select w-auto"
        [ngModel]="periodoId()"
        (ngModelChange)="periodoId.set($event)"
      >
        @for (periodo of periodos(); track periodo.id) {
          <option [ngValue]="periodo.id">
            {{ periodo.codigo }}{{ periodo.activo ? ' (activo)' : '' }}
          </option>
        }
      </select>
    </div>
  }
</div>

<!-- Errores -->
<app-alerta-errores [mensajes]="errores()" />

<!-- Grupos del periodo elegido -->
<section class="card shadow-sm">
  <div class="card-body">
    <app-tabla
      [columnas]="columnas"
      [filas]="visibles()"
      [cargando]="cargando()"
      vacio="No tienes grupos asignados en este periodo."
    >
      <ng-template #acciones let-grupo>
        <a class="btn btn-outline-primary btn-sm" [routerLink]="['/profesor/grupos', grupo.id]">
          <i class="fa-solid fa-user-pen me-1" aria-hidden="true"></i>Estudiantes y notas
        </a>
      </ng-template>
    </app-tabla>
  </div>
</section>
