<!-- Tarjeta de bienvenida centrada, con las clases utilitarias de Bootstrap. -->
<section class="card shadow-sm mx-auto" style="max-width: 40rem">
  <div class="card-body text-center p-5">
    <!-- Ícono decorativo de Font Awesome (aria-hidden: no lo lee el lector de pantalla). -->
    <i class="fa-solid fa-graduation-cap fa-3x text-success mb-3" aria-hidden="true"></i>
    <!-- Título principal de la página. -->
    <h1 class="h3">{{ titulo }}</h1>
    <!-- Descripción breve del sistema. -->
    <p class="text-muted mb-0">{{ descripcion }}</p>
  </div>
</section>
