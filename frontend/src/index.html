<!doctype html>
<!-- Idioma de la página: español, para lectores de pantalla y corrección ortográfica del navegador. -->
<html lang="es">
<head>
  <!-- Codificación de caracteres: necesaria para mostrar tildes y la letra ñ. -->
  <meta charset="utf-8">
  <!-- Título que aparece en la pestaña del navegador. -->
  <title>Universidad El Arbolado - Gestión Académica</title>
  <!-- Ruta base: todas las rutas de Angular se resuelven a partir de la raíz del sitio. -->
  <base href="/">
  <!-- Adapta el ancho de la página a la pantalla del celular (diseño responsivo de Bootstrap). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Ícono de la pestaña. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Punto de montaje: Angular dibuja aquí el componente raíz (App). -->
  <app-root></app-root>
</body>
</html>
